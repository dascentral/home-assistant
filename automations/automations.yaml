- id: morning_spigot_watering
  alias: Morning Spigot Watering
  description: >-
    Run both spigots: side A for 30 min, then side B for 30 min.
    Re-sends turn_on every 9 min to prevent Sonoff 10-min auto-shutoff.
  triggers:
    - id: a_on
      trigger: time
      at:
        - '04:30:00'
        - '04:39:00'
        - '04:48:00'
    - id: a_off_b_on
      trigger: time
      at: '05:00:00'
    - id: b_on
      trigger: time
      at:
        - '05:09:00'
        - '05:18:00'
    - id: b_off
      trigger: time
      at: '05:30:00'
  conditions:
    - condition: time
      weekday:
        - mon
        - fri
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: a_on
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_a
                  - switch.sonoff_side_spigot_a
        - conditions:
            - condition: trigger
              id: a_off_b_on
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_a
                  - switch.sonoff_side_spigot_a
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_b
                  - switch.sonoff_side_spigot_b
        - conditions:
            - condition: trigger
              id: b_on
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_b
                  - switch.sonoff_side_spigot_b
        - conditions:
            - condition: trigger
              id: b_off
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_b
                  - switch.sonoff_side_spigot_b
  mode: single
