bedroom_wake_up:
  alias: "Bedroom Wake Up"
  description: "Activates Hue wake up scene and turns off overhead."
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_wake_up
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead
  mode: single
