bedroom_winter_blue:
  alias: "Bedroom Winter Blue"
  description: "Activates Hue winter blue scene and turns off overhead."
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_winter_blue
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead
  mode: single
