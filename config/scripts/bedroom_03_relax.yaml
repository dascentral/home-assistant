bedroom_relax:
  alias: 'Bedroom 03 Relax'
  description: 'Activates Hue relax scene and turns off overhead.'
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_relax
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead
  mode: single
