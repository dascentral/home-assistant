bedroom_full:
  alias: 'Bedroom 05 Full'
  description: 'Activates Hue full scene and sets overhead to 100%.'
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_full
    - service: light.turn_on
      target:
        entity_id: light.bedroom_overhead
      data:
        brightness_pct: 100
  mode: single
