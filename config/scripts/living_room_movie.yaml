living_room_movie:
  alias: "Living Room Movie"
  description: "Activates Hue movie scene and turns off CASA dimmers."
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_living_room_movie
    - service: light.turn_off
      target:
        entity_id:
          - light.comet
          - light.cupid
  mode: single
