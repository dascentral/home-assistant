nursery_overnight:
  alias: 'Nursery Overnight'
  description: 'Activates Hue overnight scene and turns off overhead.'
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_nursery_overnight
    - service: light.turn_off
      target:
        entity_id: light.nursery_overhead
  mode: single
