nursery_bedtime:
  alias: 'Nursery Bedtime'
  description: 'Activates Hue bedtime scene and turns off overhead.'
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_nursery_bedtime
    - service: light.turn_off
      target:
        entity_id: light.nursery_overhead
  mode: single
