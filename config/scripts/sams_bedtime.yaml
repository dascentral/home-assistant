sams_bedtime:
  alias: "Sam's Bedtime"
  description: "Sets cozy/dim lighting throughout the house for Sam's bedtime."
  sequence:
    # Living Room
    - service: script.turn_on
      target:
        entity_id: script.living_room_cozy

    # Kitchen
    - service: light.turn_on
      target:
        entity_id: light.island
      data:
        brightness_pct: 20

    # Office
    - service: scene.turn_on
      target:
        entity_id: scene.hue_office_cozy

    # Bedroom
    - service: script.turn_on
      target:
        entity_id: script.bedroom_cozy

    # Nursery
    - service: script.turn_on
      target:
        entity_id: script.nursery_nursing

    # Master Bedroom Shades
    - service: cover.close_cover
      target:
        entity_id:
          - cover.master_01
          - cover.master_02
          - cover.master_03
          - cover.master_04
          - cover.master_05

    - service: logbook.log
      data:
        name: Routine
        message: "Sam's bedtime routine activated"
  mode: single
  icon: mdi:weather-night
