sams_bedtime_routine:
  alias: "Sam's Bedtime Routine"
  description: "Sets cozy/dim lighting throughout the house for Sam's bedtime."
  sequence:
    # Living Room
    - service: scene.turn_on
      target:
        entity_id: scene.living_room_cozy
    - service: light.turn_off
      target:
        entity_id:
          - light.cupid
          - light.comet

    # Kitchen
    - service: light.turn_on
      target:
        entity_id: light.island
      data:
        brightness_pct: 20

    # Office
    - service: scene.turn_on
      target:
        entity_id: scene.office_cozy

    # Bedroom
    - service: scene.turn_on
      target:
        entity_id: scene.bedroom_cozy
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead

    # Nursery
    - service: scene.turn_on
      target:
        entity_id: scene.nursery_nursing

    - service: logbook.log
      data:
        name: Routine
        message: "Sam's bedtime routine activated"
  mode: single
  icon: mdi:weather-night
