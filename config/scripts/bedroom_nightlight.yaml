bedroom_nightlight:
  alias: "Bedroom Nightlight"
  description: "Activates Hue nightlight scene and turns off overhead."
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_nightlight
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead
  mode: single
