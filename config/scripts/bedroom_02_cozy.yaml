bedroom_cozy:
  alias: 'Bedroom 02 Cozy'
  description: 'Activates Hue cozy scene and turns off overhead.'
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_bedroom_cozy
    - service: light.turn_off
      target:
        entity_id: light.bedroom_overhead
  mode: single
