living_room_winter_blue:
  alias: "Living Room Winter Blue"
  description: "Activates Hue winter blue scene and turns off CASA dimmers."
  sequence:
    - service: scene.turn_on
      target:
        entity_id: scene.hue_living_room_winter_blue
    - service: light.turn_off
      target:
        entity_id:
          - light.comet
          - light.cupid
  mode: single
