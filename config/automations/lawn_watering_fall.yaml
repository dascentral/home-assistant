- id: fall_seed_watering
  alias: Lawn Watering (Fall Seeding)
  description: >-
    Keeps the top 1/2-1 inch of soil moist after fall aeration and overseeding,
    per the Nuleaf aftercare guide (2026-10-26): water 1-2 times daily, early
    morning preferred. Side A for 8 min, then side B for 8 min; each run stays
    under the Sonoff 10-min auto-shutoff, so no re-sends are needed.
    Stops on its own after 2026-12-06; turn off sooner once new grass is ~2 in tall.
  triggers:
    - id: a_on
      trigger: time
      at:
        - '07:00:00'
        - '13:00:00'
    - id: a_off_b_on
      trigger: time
      at:
        - '07:08:00'
        - '13:08:00'
    - id: b_off
      trigger: time
      at:
        - '07:16:00'
        - '13:16:00'
  conditions:
    - condition: template
      value_template: "{{ now().date() <= as_datetime('2026-12-06').date() }}"
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: a_on
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_a
                  - switch.sonoff_side_spigot_a
        - conditions:
            - condition: trigger
              id: a_off_b_on
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_a
                  - switch.sonoff_side_spigot_a
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_b
                  - switch.sonoff_side_spigot_b
        - conditions:
            - condition: trigger
              id: b_off
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.sonoff_backyard_spigot_b
                  - switch.sonoff_side_spigot_b
  mode: single
